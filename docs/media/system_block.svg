<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="620" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">ESP32-S3 Mini Tracked Tank Block Diagram</text>
  <text x="410" y="58" text-anchor="middle" font-size="11" fill="#64748b">All modules plug into the expansion board sockets, which stack onto the controller header (pin labels follow the actual board silkscreen)</text>

  <!-- Connecting lines: draw lines first, then boxes, so line ends are hidden under the boxes -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M300,124 L250,124"/>
    <path d="M300,204 L250,204"/>
    <path d="M300,290 L250,290"/>
    <path d="M300,376 L250,376"/>
    <path d="M520,124 L570,124"/>
    <path d="M520,204 L570,204"/>
    <path d="M520,290 L570,290"/>
    <path d="M520,376 L570,376"/>
    <path d="M410,404 L410,460"/>
  </g>
  <!-- Wireless connection uses a dashed line -->
  <path d="M410,546 L410,562" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="560" font-size="11" fill="#7c3aed">Wi-Fi</text>

  <!-- Expansion board: the landing point for all peripherals -->
  <rect x="300" y="76" width="220" height="328" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Expansion Board (DRV8835)</text>
  <text x="310" y="128" font-size="10" fill="#15803d">Channel A IO38/21</text>
  <text x="510" y="128" text-anchor="end" font-size="10" fill="#15803d">Channel B IO40/41</text>
  <text x="310" y="208" font-size="10" fill="#15803d">Matrix IO8/IO9</text>
  <text x="510" y="208" text-anchor="end" font-size="10" fill="#15803d">Ultrasonic IO12/13</text>
  <text x="310" y="294" font-size="10" fill="#15803d">I2C IO8/IO9</text>
  <text x="510" y="294" text-anchor="end" font-size="10" fill="#15803d">Servo IO42</text>
  <text x="310" y="380" font-size="10" fill="#15803d">UART IO17/18</text>
  <text x="510" y="380" text-anchor="end" font-size="10" fill="#15803d">Servo IO11</text>

  <!-- Main controller -->
  <rect x="300" y="460" width="220" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="492" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">ESP32-S3 Controller</text>
  <text x="410" y="514" text-anchor="middle" font-size="11" fill="#1e40af">Wi-Fi + BLE 5.0, dual-core 240MHz</text>
  <text x="410" y="534" text-anchor="middle" font-size="11" fill="#1e40af">3.3V logic, header stacks onto expansion board</text>
  <text x="423" y="447" font-size="10" fill="#64748b">Header stacked</text>

  <!-- Left: motor, matrix, line tracking, vision -->
  <rect x="30" y="96" width="220" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Left Motor (physical left wheel)</text>
  <text x="140" y="142" text-anchor="middle" font-size="10.5" fill="#15803d">Motor terminal channel A</text>

  <rect x="30" y="176" width="220" height="56" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">8×16 Dot Matrix Display</text>
  <text x="140" y="222" text-anchor="middle" font-size="10.5" fill="#b45309">DIN-IO8 / CLK-IO9</text>

  <rect x="30" y="262" width="220" height="56" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Line-Tracking Sensor</text>
  <text x="140" y="308" text-anchor="middle" font-size="10.5" fill="#b45309">I2C: SDA-IO8 / SCL-IO9</text>

  <rect x="30" y="348" width="220" height="56" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="140" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">AI Vision Module</text>
  <text x="140" y="394" text-anchor="middle" font-size="10.5" fill="#be185d">UART: RX18 / TX17</text>

  <!-- Right: motor, ultrasonic, pan-tilt, gripper -->
  <rect x="570" y="96" width="220" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Right Motor (physical right wheel)</text>
  <text x="680" y="142" text-anchor="middle" font-size="10.5" fill="#15803d">Motor terminal channel B</text>

  <rect x="570" y="176" width="220" height="56" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Ultrasonic Module</text>
  <text x="680" y="222" text-anchor="middle" font-size="10.5" fill="#b45309">Trig-IO13 / Echo-IO12</text>

  <rect x="570" y="262" width="220" height="56" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="680" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Pan-Tilt Servo</text>
  <text x="680" y="308" text-anchor="middle" font-size="10.5" fill="#be185d">IO42, 0–180°</text>

  <rect x="570" y="348" width="220" height="56" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="680" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Gripper Servo</text>
  <text x="680" y="394" text-anchor="middle" font-size="10.5" fill="#be185d">IO11, 90–140°</text>

  <!-- Phone / web page -->
  <rect x="300" y="562" width="220" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Phone / Web Remote Control</text>
  <text x="410" y="601" text-anchor="middle" font-size="10" fill="#5b21b6">Connects to controller via Wi-Fi</text>
</svg>
