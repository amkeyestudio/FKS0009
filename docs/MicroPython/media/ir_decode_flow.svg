<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="760" height="690" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="690" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">红外接收</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M380,96 L380,118"/>
    <path d="M380,174 L380,196"/>
    <path d="M380,244 L380,270"/>
    <path d="M380,370 L380,408"/>
  </g>

  <rect x="310" y="62" width="140" height="34" rx="17" fill="#1e293b"/>
  <text x="380" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">开始</text>

  <rect x="160" y="118" width="440" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">初始化红外接收头</text>
  <text x="380" y="161" text-anchor="middle" font-size="12" fill="#0369a1">信号脚接 IO48，收到信号时触发</text>

  <rect x="300" y="196" width="160" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">等待一帧信号</text>

  <polygon points="380,270 540,320 380,370 220,320" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">收到完整一帧？</text>
  <text x="380" y="336" text-anchor="middle" font-size="11.5" fill="#b45309">校验通过才算收到</text>

  <polygon points="380,408 560,460 380,512 200,460" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">是长按的重复帧？</text>
  <text x="380" y="476" text-anchor="middle" font-size="11.5" fill="#b45309">按住不放时反复发同一码</text>

  <rect x="110" y="560" width="230" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="583" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">提示「长按中」</text>
  <text x="225" y="603" text-anchor="middle" font-size="12" fill="#64748b">只提示一次，不逐帧刷屏</text>

  <rect x="420" y="560" width="240" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="583" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">打印这一帧的结果</text>
  <text x="540" y="603" text-anchor="middle" font-size="12" fill="#15803d">协议名、按键码、按键名</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M380,512 L380,532 L225,532 L225,560" marker-end="url(#arrow)"/>
    <path d="M380,512 L380,532 L540,532 L540,560" marker-end="url(#arrow)"/>
  </g>
  <text x="300" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">是</text>
  <text x="470" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">否</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M540,320 L700,320 L700,220 L462,220" marker-end="url(#arrow)"/>
  </g>
  <text x="585" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">否</text>

  <g stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none">
    <path d="M225,616 L225,658 L56,658 L56,220 L298,220" marker-end="url(#arrowdash)"/>
    <path d="M540,616 L540,658 L56,658"/>
  </g>
</svg>
