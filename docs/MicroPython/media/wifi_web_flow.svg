<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Wi-Fi 连接</text>

  <rect x="230" y="80" width="300" height="40" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">手机点按钮 / 打开页面</text>

  <path d="M380,120 L380,144" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="200" y="144" width="360" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">主循环里持续处理请求</text>
  <text x="380" y="180" text-anchor="middle" font-size="10.5" fill="#0369a1">不加延时，每轮都调用，否则页面卡住</text>

  <path d="M380,188 L380,212" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="380,212 520,264 380,316 240,264" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">请求的是哪个路径？</text>
  <text x="380" y="276" text-anchor="middle" font-size="10.5" fill="#b45309">按路径交给不同处理</text>

  <path d="M240,264 L180,264 L180,352" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <path d="M380,316 L380,352" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,264 L580,264 L580,352" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

  <!-- 三个分支 -->
  <rect x="70" y="352" width="220" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="373" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">首页请求 → 返回页面</text>
  <text x="180" y="392" text-anchor="middle" font-size="10.5" fill="#15803d">把整页 HTML 发回去</text>
  <text x="180" y="408" text-anchor="middle" font-size="10.5" fill="#15803d">HTML 存在 Flash 里</text>
  <text x="180" y="423" text-anchor="middle" font-size="10.5" fill="#15803d">不占运行内存</text>

  <rect x="300" y="352" width="220" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="410" y="373" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">转向请求</text>
  <text x="410" y="392" text-anchor="middle" font-size="10.5" fill="#0369a1">取出目标角度</text>
  <text x="410" y="408" text-anchor="middle" font-size="10.5" fill="#0369a1">限幅到 0～180°</text>
  <text x="410" y="423" text-anchor="middle" font-size="10.5" fill="#0369a1">转过去，回传当前角度</text>

  <rect x="530" y="352" width="220" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="640" y="373" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">测距请求</text>
  <text x="640" y="392" text-anchor="middle" font-size="10.5" fill="#0369a1">现测一次距离</text>
  <text x="640" y="408" text-anchor="middle" font-size="10.5" fill="#0369a1">超时 25 ms，防止无回波阻塞</text>
  <text x="640" y="423" text-anchor="middle" font-size="10.5" fill="#0369a1">返回纯文本数字</text>

  <path d="M180,428 L180,452 L380,452" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M410,428 L410,452" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M640,428 L640,452 L380,452" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M380,452 L380,470" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="230" y="470" width="300" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="380" y="487" text-anchor="middle" font-size="11" fill="#334155">浏览器收到响应，页面更新</text>

</svg>
