<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">红外遥控车</text>

  <rect x="200" y="82" width="360" height="44" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">每一轮做两件事</text>
  <text x="380" y="119" text-anchor="middle" font-size="10.5" fill="#cbd5e1">处理红外 + 检查超时，互不阻塞</text>

  <path d="M380,126 L380,146 L200,146 L200,168" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M380,146 L560,146 L560,168" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 左：红外 -->
  <rect x="60" y="168" width="280" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="200" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">① 有红外帧？</text>

  <polygon points="200,206 330,260 200,314 70,260" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="200" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">收到一帧了吗？</text>
  <text x="200" y="274" text-anchor="middle" font-size="10" fill="#b45309">没收到就跳过下面</text>

  <path d="M200,314 L200,330" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="326" font-size="11" font-weight="bold" fill="#dc2626">是</text>

  <rect x="55" y="330" width="290" height="100" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="351" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">按键分三种情况，只走一条</text>
  <text x="200" y="373" text-anchor="middle" font-size="10" fill="#475569">长按重复帧 → 只刷新计时</text>
  <text x="200" y="393" text-anchor="middle" font-size="10" fill="#166534">新键且是已知键 → 执行动作 + 刷计时</text>
  <text x="200" y="413" text-anchor="middle" font-size="10" fill="#475569">其他键 → 什么都不做</text>

  <!-- 右：超时 -->
  <rect x="440" y="168" width="280" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="580" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">② 超时检查</text>

  <polygon points="580,206 700,258 580,310 460,258" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="580" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">距上次按键多久</text>
  <text x="580" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">超过 1500 ms ？</text>
  <text x="580" y="290" text-anchor="middle" font-size="10" fill="#b45309">没超时就不动</text>

  <path d="M580,310 L580,330" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="326" font-size="11" font-weight="bold" fill="#dc2626">是</text>

  <rect x="450" y="330" width="260" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">停车</text>
  <text x="580" y="370" text-anchor="middle" font-size="10.5" fill="#b91c1c">丢包 / 超出距离时防止失控</text>

  <path d="M580,382 L580,398" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="470" y="398" width="220" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="424" text-anchor="middle" font-size="11.5" fill="#0f172a">本轮结束</text>

  <!-- 循环 -->
  <path d="M200,430 L200,470 L20,470 L20,146 L196,146" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
