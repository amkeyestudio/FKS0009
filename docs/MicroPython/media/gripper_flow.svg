<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="800" height="570" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">夹爪开合</text>

  <!-- 主干 -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M400,90 L400,112"/>
    <path d="M400,168 L400,192"/>
    <path d="M400,248 L400,272"/>
    <path d="M400,324 L400,348"/>
    <path d="M400,404 L400,428"/>
  </g>

  <!-- 开始 -->
  <rect x="330" y="62" width="140" height="28" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">上电</text>

  <!-- 初始位 -->
  <rect x="190" y="114" width="420" height="54" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">先到 90°，这是夹紧位</text>
  <text x="400" y="156" text-anchor="middle" font-size="11" fill="#0369a1">脉宽 500～2500 µs，50 Hz</text>

  <!-- 张开 -->
  <rect x="190" y="194" width="420" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">逐度张开：90° 转到 140°</text>
  <text x="400" y="236" text-anchor="middle" font-size="11" fill="#15803d">每度停 15 ms，走完约 0.75 秒</text>

  <!-- 停顿 -->
  <rect x="280" y="274" width="240" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="296" text-anchor="middle" font-size="12.5" fill="#0f172a">停 0.5 s</text>
  <text x="400" y="316" text-anchor="middle" font-size="11" fill="#64748b">停半秒再动</text>

  <!-- 夹紧 -->
  <rect x="190" y="350" width="420" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">逐度夹紧：140° 回到 90°</text>
  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#b45309">同样每度停 15 ms</text>

  <!-- 停顿 -->
  <rect x="280" y="430" width="240" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="452" text-anchor="middle" font-size="12.5" fill="#0f172a">再停 0.5 s</text>
  <text x="400" y="472" text-anchor="middle" font-size="11" fill="#64748b">停半秒再动</text>

  <!-- 循环 -->
  <path d="M400,480 L400,510 L60,510 L60,221 L186,221" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
