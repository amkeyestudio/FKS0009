<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">舵机控制</text>

  <!-- 0° -->
  <text x="86" y="112" text-anchor="end" font-size="12.5" font-weight="bold" fill="#0f172a">0°</text>
  <text x="86" y="130" text-anchor="end" font-size="10.5" fill="#64748b">朝右</text>
  <polyline points="100,130 200,130 200,96 215,96 215,130 700,130" fill="none" stroke="#0284c7" stroke-width="2.2"/>
  <path d="M200,84 L215,84" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M215,84 L200,84" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="240" y="88" font-size="10.5" font-weight="bold" fill="#dc2626">0.5 ms</text>
  <text x="400" y="150" text-anchor="middle" font-size="10.5" fill="#64748b">一个周期 20 ms</text>

  <!-- 90° -->
  <text x="86" y="222" text-anchor="end" font-size="12.5" font-weight="bold" fill="#0f172a">90°</text>
  <text x="86" y="240" text-anchor="end" font-size="10.5" fill="#64748b">正前</text>
  <polyline points="100,240 240,240 240,206 285,206 285,240 700,240" fill="none" stroke="#16a34a" stroke-width="2.2"/>
  <path d="M240,194 L285,194" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M285,194 L240,194" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="310" y="198" font-size="10.5" font-weight="bold" fill="#dc2626">1.5 ms</text>

  <!-- 180° -->
  <text x="86" y="332" text-anchor="end" font-size="12.5" font-weight="bold" fill="#0f172a">180°</text>
  <text x="86" y="350" text-anchor="end" font-size="10.5" fill="#64748b">朝左</text>
  <polyline points="100,350 280,350 280,316 355,316 355,350 700,350" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <path d="M280,304 L355,304" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M355,304 L280,304" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="380" y="308" font-size="10.5" font-weight="bold" fill="#dc2626">2.5 ms</text>

  <!-- 说明 -->
</svg>
