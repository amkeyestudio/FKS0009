<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="660" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">点阵显示</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M380,96 L380,120"/>
    <path d="M380,176 L380,202"/>
    <path d="M380,258 L380,284"/>
    <path d="M380,340 L380,366"/>
    <path d="M380,422 L380,438"/>
    <path d="M380,480 L380,530"/>
  </g>

  <rect x="310" y="62" width="140" height="34" rx="17" fill="#1e293b"/>
  <text x="380" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">开始</text>

  <rect x="160" y="120" width="440" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">初始化点阵</text>
  <text x="380" y="163" text-anchor="middle" font-size="12" fill="#0369a1">两根信号线置为空闲电平，显存清零</text>

  <rect x="200" y="202" width="360" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">显示爱心图案</text>
  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#64748b">保持 3 秒</text>

  <rect x="200" y="284" width="360" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">显示笑脸图案</text>
  <text x="380" y="327" text-anchor="middle" font-size="12" fill="#64748b">保持 2 秒</text>

  <rect x="170" y="366" width="420" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="389" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">滚一帧：整幅图左移一列后写屏</text>
  <text x="380" y="409" text-anchor="middle" font-size="12" fill="#15803d">移出去的一列从尾部补回，首尾相接</text>

  <rect x="280" y="438" width="200" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="465" text-anchor="middle" font-size="13" fill="#334155">停留 150 ms</text>

  <polygon points="380,530 540,566 380,602 220,566" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="571" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">滚满 16 帧了吗？</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M540,566 L706,566 L706,394 L594,394" marker-end="url(#arrow)"/>
  </g>
  <text x="600" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">否</text>

  <g stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none">
    <path d="M380,602 L380,608 L56,608 L56,230 L194,230" marker-end="url(#arrowdash)"/>
  </g>
  <text x="250" y="610" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">是 · 回到第一帧重来</text>
</svg>
