<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">人脸跟随</text>

  <rect x="80" y="80" width="300" height="38" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="230" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">从串口读到人脸坐标</text>

  <path d="M230,118 L230,138" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="230,138 350,182 230,226 110,182" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="230" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">看得到人？</text>
  <text x="230" y="196" text-anchor="middle" font-size="10.5" fill="#b45309">这一帧检测到人了吗</text>

  <path d="M350,182 L390,182" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="174" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <rect x="392" y="156" width="300" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="542" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">点阵回眼睛</text>
  <text x="542" y="195" text-anchor="middle" font-size="10.5" fill="#b91c1c">超过 300 ms 没看到人 → 停车</text>

  <path d="M230,226 L230,248" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="242" font-size="11" font-weight="bold" fill="#16a34a">是</text>

  <rect x="80" y="248" width="300" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">记下这次看到的时刻，点阵笑脸</text>
  <text x="230" y="287" text-anchor="middle" font-size="10.5" fill="#15803d">每次看到都刷新，供超时判断用</text>

  <path d="M230,300 L230,320" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="230,320 350,364 230,408 110,364" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="230" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">标定完成？</text>
  <text x="230" y="378" text-anchor="middle" font-size="10.5" fill="#b45309">还没记下正前方的位置</text>

  <path d="M350,364 L390,364" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="356" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <rect x="392" y="330" width="300" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="542" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">累加前 20 帧，期间停车</text>
  <text x="542" y="369" text-anchor="middle" font-size="10.5" fill="#0369a1">把前 20 帧的横坐标累加</text>
  <text x="542" y="386" text-anchor="middle" font-size="10.5" fill="#0369a1">满 20 帧取平均，作为正前方</text>

  <path d="M230,408 L230,428" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="422" font-size="11" font-weight="bold" fill="#16a34a">是</text>

  <polygon points="230,428 350,472 230,516 110,472" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="230" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">偏差在死区内？</text>
  <text x="230" y="486" text-anchor="middle" font-size="10.5" fill="#b45309">偏差在 ±8 以内</text>

  <path d="M350,472 L390,472" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="464" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <rect x="392" y="438" width="300" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="542" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">差速转向</text>
  <text x="542" y="477" text-anchor="middle" font-size="10.5" fill="#0369a1">偏差 × 0.5 得到修正量</text>
  <text x="542" y="494" text-anchor="middle" font-size="10.5" fill="#0369a1">限幅 ±80，左右轮各加/减</text>

  <path d="M230,516 L230,536" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="530" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <rect x="80" y="536" width="300" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="556" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">直行靠近</text>
  <text x="230" y="575" text-anchor="middle" font-size="10.5" fill="#15803d">两轮同速前进，速度 100</text>

  <path d="M80,560 L40,560 L40,160 L106,160" stroke="#0ea5e9" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
