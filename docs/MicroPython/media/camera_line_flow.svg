<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">摄像头巡线</text>

  <rect x="250" y="80" width="260" height="40" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">从串口读一行数据</text>

  <path d="M380,120 L380,142" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="180" y="142" width="400" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">取出偏差和有效标志</text>
  <text x="380" y="180" text-anchor="middle" font-size="10.5" fill="#0369a1">模块回传：偏差、角度、有效位</text>

  <path d="M380,188 L380,208" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="380,208 500,256 380,304 260,256" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">这一帧看到线了吗？</text>
  <text x="380" y="270" text-anchor="middle" font-size="10.5" fill="#b45309">有效位为 5 才算看到</text>

  <!-- 是：PD -->
  <path d="M260,256 L170,256 L170,320" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="206" y="248" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <rect x="40" y="320" width="260" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">PD 修正</text>
  <text x="170" y="359" text-anchor="middle" font-size="10.5" fill="#15803d">微分项 = 本次偏差 − 上次偏差</text>
  <text x="170" y="375" text-anchor="middle" font-size="10.5" fill="#15803d">修正 = 偏差×0.4 + 微分×0.6</text>
  <text x="170" y="391" text-anchor="middle" font-size="10.5" fill="#15803d">限幅 ±90，微分限幅 ±50</text>
  <text x="170" y="407" text-anchor="middle" font-size="10.5" fill="#15803d">两侧基准 115，一加一减</text>

  <!-- 否：找线 -->
  <path d="M500,256 L590,256 L590,320" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="556" y="248" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <polygon points="590,320 700,368 590,416 480,368" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="590" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">600 ms 内？</text>
  <text x="590" y="382" text-anchor="middle" font-size="10.5" fill="#b45309">从刚丢线开始计时</text>

  <path d="M480,368 L430,368 L430,440" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="446" y="360" font-size="10.5" font-weight="bold" fill="#16a34a">是</text>
  <rect x="290" y="440" width="280" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="430" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">按记忆方向原地找线</text>
  <text x="430" y="479" text-anchor="middle" font-size="10.5" fill="#0369a1">上次偏右超过 15：向右找</text>
  <text x="430" y="495" text-anchor="middle" font-size="10.5" fill="#0369a1">上次偏左超过 15：向左找</text>
  <text x="430" y="510" text-anchor="middle" font-size="10.5" fill="#0369a1">上次偏差在 ±15 内：方向不明，停车</text>

  <path d="M590,416 L590,440" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="602" y="434" font-size="10.5" font-weight="bold" fill="#dc2626">否</text>
  <rect x="590" y="440" width="150" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="464" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">超时停车</text>
  <text x="665" y="482" text-anchor="middle" font-size="10.5" fill="#b91c1c">点阵苦脸</text>
  <text x="665" y="498" text-anchor="middle" font-size="10.5" fill="#b91c1c">等你摆正车</text>

  <!-- 汇合 -->
  <path d="M170,416 L170,540 L380,540" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M430,516 L430,540" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M665,516 L665,540 L380,540" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M380,540 L380,558" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <rect x="270" y="558" width="220" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="583" text-anchor="middle" font-size="11.5" fill="#0f172a">每 5 ms 一轮</text>

  <path d="M270,578 L40,578 L40,165 L176,165" stroke="#0ea5e9" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
