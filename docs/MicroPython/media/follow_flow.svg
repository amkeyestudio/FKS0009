<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="800" height="690" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">超声波跟随</text>

  <!-- 主干 -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250,108 L250,126"/>
    <path d="M250,176 L250,198"/>
    <path d="M250,248 L250,270"/>
    <path d="M250,472 L250,498"/>
    <path d="M250,548 L250,576"/>
  </g>

  <!-- 开始 -->
  <rect x="180" y="80" width="140" height="28" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="250" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">开始</text>

  <!-- 初始化 -->
  <rect x="60" y="128" width="380" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">初始化：电机停车 · 点阵清屏后显示笑脸</text>
  <text x="250" y="167" text-anchor="middle" font-size="11" fill="#0369a1">电机停转，点阵清屏后显示笑脸</text>

  <!-- 测距 -->
  <rect x="120" y="200" width="260" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">测前方距离</text>
  <text x="250" y="239" text-anchor="middle" font-size="11" fill="#0369a1">Trig 发 10 µs 脉冲 · Echo 读高电平宽度</text>

  <!-- 判断 -->
  <polygon points="250,272 400,372 250,472 100,372" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="250" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">距离 d 落在哪一段？</text>
  <text x="250" y="382" text-anchor="middle" font-size="11" fill="#b45309">自上而下比较，只走一条</text>
  <text x="250" y="400" text-anchor="middle" font-size="11" fill="#b45309">四条分支只走一条</text>

  <!-- 分支总线 -->
  <path d="M400,372 L440,372" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M440,279 L440,489" stroke="#475569" stroke-width="1.8" fill="none"/>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M440,279 L466,279"/>
    <path d="M440,349 L466,349"/>
    <path d="M440,419 L466,419"/>
    <path d="M440,489 L466,489"/>
  </g>

  <!-- 分支 1：丢失 -->
  <rect x="470" y="250" width="300" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">距离为 0 或大于 50：目标丢失</text>
  <text x="620" y="290" text-anchor="middle" font-size="11" fill="#b91c1c">停车，点阵显示问号</text>

  <!-- 分支 2：跟随 -->
  <rect x="470" y="320" width="300" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">30～50：跟随前进</text>
  <text x="620" y="360" text-anchor="middle" font-size="11" fill="#15803d">两轮同速前进，点阵爱心</text>

  <!-- 分支 3：停止 -->
  <rect x="470" y="390" width="300" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="620" y="411" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">10～30：停住</text>
  <text x="620" y="430" text-anchor="middle" font-size="11" fill="#475569">停车，点阵显示笑脸</text>

  <!-- 分支 4：后退 -->
  <rect x="470" y="460" width="300" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="481" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">0～10：后退</text>
  <text x="620" y="500" text-anchor="middle" font-size="11" fill="#15803d">左右差速后退，点阵下箭头</text>

  <!-- 延时 -->
  <rect x="140" y="498" width="220" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="250" y="519" text-anchor="middle" font-size="12.5" fill="#0f172a">延时 100 ms</text>
  <text x="250" y="538" text-anchor="middle" font-size="11" fill="#64748b">每轮停 100 ms</text>

  <!-- 循环 -->
  <path d="M250,576 L250,600 L40,600 L40,224 L116,224" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
