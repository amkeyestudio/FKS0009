<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">整车安装流程</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#64748b">按此顺序装配：从点阵板开始，AI 视觉模块留到最后</text>

  <!-- 起点提示 -->
  <rect x="230" y="80" width="300" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">安装前：舵机回中、撕保护膜、防静电</text>
  <path d="M380,118 L380,140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 蛇形连线：左列向下 (x=210)，底部横跨，右列向上 (x=550) -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210,190 L210,225"/>
    <path d="M210,275 L210,310"/>
    <path d="M210,360 L210,395"/>
    <path d="M210,445 L210,480"/>
    <path d="M360,505 L550,505"/>
    <path d="M550,480 L550,445"/>
    <path d="M550,395 L550,360"/>
    <path d="M550,310 L550,275"/>
    <path d="M550,225 L550,190"/>
  </g>

  <!-- 左列步骤 1-5 -->
  <rect x="60" y="140" width="300" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="170" font-size="14" font-weight="bold" fill="#0f172a">1　点阵与亚克力板</text>

  <rect x="60" y="225" width="300" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="255" font-size="14" font-weight="bold" fill="#0f172a">2　亚克力板铜柱</text>

  <rect x="60" y="310" width="300" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="340" font-size="14" font-weight="bold" fill="#0f172a">3　前置夹爪</text>

  <rect x="60" y="395" width="300" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="425" font-size="14" font-weight="bold" fill="#0f172a">4　底座与亚克力板铜柱</text>

  <rect x="60" y="480" width="300" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="510" font-size="14" font-weight="bold" fill="#0f172a">5　主控板与扩展板</text>

  <!-- 右列步骤 6-10（自下而上） -->
  <rect x="400" y="480" width="290" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="418" y="510" font-size="14" font-weight="bold" fill="#0f172a">6　超声波云台与舵机</text>

  <rect x="400" y="395" width="290" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="418" y="425" font-size="14" font-weight="bold" fill="#0f172a">7　电池仓</text>

  <rect x="400" y="310" width="290" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="418" y="340" font-size="14" font-weight="bold" fill="#0f172a">8　接线与整理</text>

  <rect x="400" y="225" width="290" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="418" y="255" font-size="14" font-weight="bold" fill="#92400e">9　AI 视觉模块（选装）</text>

  <rect x="400" y="140" width="290" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="418" y="170" font-size="14" font-weight="bold" fill="#166534">10　上电与自检</text>

  <text x="380" y="575" text-anchor="middle" font-size="13" fill="#92400e">第 9 步是选装：不装先做 1–16 课，先装则按装法做 17–20 课。</text>
  <text x="380" y="598" text-anchor="middle" font-size="13" fill="#475569">第 10 步自检通过后进入 2.3 节核对线路；发现短路、接反先断电。</text>
</svg>
