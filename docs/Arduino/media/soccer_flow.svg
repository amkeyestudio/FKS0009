<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">足球智能车</text>

  <rect x="60" y="82" width="250" height="46" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="185" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">手机点按钮</text>
  <text x="185" y="119" text-anchor="middle" font-size="10.5" fill="#cbd5e1">请求里带着指令</text>

  <path d="M310,105 L362,105" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="364" y="82" width="330" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="529" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">处理指令，返回「比分,状态」</text>
  <text x="529" y="119" text-anchor="middle" font-size="10.5" fill="#0369a1">先刷新超时计时，再分派指令</text>

  <path d="M529,128 L529,150 L380,150 L380,168" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="380,168 500,214 380,260 260,214" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">是哪个指令？</text>
  <text x="380" y="228" text-anchor="middle" font-size="10.5" fill="#b45309">一条一条往下比</text>

  <!-- 三分叉 -->
  <path d="M380,260 L380,278 L150,278 L150,300" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M380,278 L380,300" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M380,278 L610,278 L610,300" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- 三个分支 -->
  <rect x="50" y="300" width="200" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="150" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">f / b / l / r</text>
  <text x="150" y="340" text-anchor="middle" font-size="10.5" fill="#15803d">前进 / 后退 / 原地转向</text>
  <text x="150" y="357" text-anchor="middle" font-size="10.5" fill="#15803d">速度 180</text>
  <text x="150" y="374" text-anchor="middle" font-size="10.5" fill="#15803d">1.5 s 无指令自动停</text>

  <rect x="280" y="300" width="200" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">carry / shoot</text>
  <text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#0369a1">carry：张开 140° 兜球</text>
  <text x="380" y="357" text-anchor="middle" font-size="10.5" fill="#0369a1">shoot：闭合 90° 挤出</text>
  <text x="380" y="374" text-anchor="middle" font-size="10.5" fill="#0369a1">不驱动电机</text>

  <rect x="510" y="300" width="200" height="86" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">goal / reset</text>
  <text x="610" y="340" text-anchor="middle" font-size="10.5" fill="#b45309">goal：比分 +1 + 庆祝</text>
  <text x="610" y="357" text-anchor="middle" font-size="10.5" fill="#b45309">播放庆祝：笑脸 3 秒</text>
  <text x="610" y="374" text-anchor="middle" font-size="10.5" fill="#b45309">reset：比分清零</text>

  <!-- 汇合 -->
  <path d="M150,386 L150,404 L380,404" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M380,386 L380,404" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M610,386 L610,404 L380,404" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M380,404 L380,420" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="190" y="420" width="380" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="441" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">返回 "比分,进球！/待命"</text>
  <text x="380" y="460" text-anchor="middle" font-size="10.5" fill="#15803d">一次请求同时完成「执行」与「回报」</text>

  <rect x="190" y="484" width="380" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="380" y="503" text-anchor="middle" font-size="11" fill="#0f172a">网页每 1 s 另发一次 /score 轮询</text>
  <text x="380" y="519" text-anchor="middle" font-size="10.5" fill="#64748b">用于多台手机同步比分，不驱动硬件</text>
</svg>
