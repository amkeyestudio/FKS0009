<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" width="760" height="740" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="740" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">颜色追踪</text>

  <rect x="270" y="80" width="220" height="30" rx="15" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">识别到 RED 或 YELLOW</text>

  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M380,110 L380,130"/>
    <path d="M380,178 L380,198"/>
    <path d="M380,246 L380,264"/>
  </g>

  <rect x="130" y="130" width="500" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">1 靠近：低速前进 350 ms</text>
  <text x="380" y="168" text-anchor="middle" font-size="10.5" fill="#0369a1">以 150 的速度走 350 ms</text>

  <rect x="130" y="198" width="500" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">2 夹取：夹爪合到 90°，点阵爱心</text>
  <text x="380" y="236" text-anchor="middle" font-size="10.5" fill="#15803d">夹爪合到 90°，等 400 ms 到位</text>

  <polygon points="380,264 500,304 380,344 260,304" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">3 按颜色决定转向</text>
  <text x="380" y="318" text-anchor="middle" font-size="10.5" fill="#b45309">RED → 左转；其他 → 右转</text>

  <path d="M260,304 L200,304 L200,362" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,304 L560,304 L560,362" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="212" y="296" font-size="10.5" font-weight="bold" fill="#dc2626">RED</text>
  <text x="512" y="296" font-size="10.5" font-weight="bold" fill="#d97706">YELLOW</text>

  <rect x="70" y="362" width="250" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">左转 600 ms</text>
  <text x="195" y="400" text-anchor="middle" font-size="10.5" fill="#64748b">原地左转，速度 180</text>

  <rect x="440" y="362" width="250" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="565" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">右转 600 ms</text>
  <text x="565" y="400" text-anchor="middle" font-size="10.5" fill="#64748b">原地右转，速度 180</text>

  <!-- 汇合 -->
  <path d="M195,410 L195,424 L380,424" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M565,410 L565,424" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M380,424 L380,438" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="130" y="438" width="500" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">4 运送：前进 800 ms</text>
  <text x="380" y="476" text-anchor="middle" font-size="10.5" fill="#0369a1">以 180 的速度走 800 ms</text>

  <path d="M380,486 L380,502" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="130" y="502" width="500" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">5 放下：夹爪张开 140°</text>
  <text x="380" y="540" text-anchor="middle" font-size="10.5" fill="#15803d">张开到 140°，等 300 ms</text>

  <path d="M380,550 L380,566" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="130" y="566" width="500" height="48" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">6 后退到转向点：后退 800 ms</text>
  <text x="380" y="604" text-anchor="middle" font-size="10.5" fill="#475569">后退，速度 180</text>

  <path d="M380,614 L380,630" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="130" y="630" width="500" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">7 回正：反向转 600 ms　→　8 倒退回起点 350 ms</text>
  <text x="380" y="669" text-anchor="middle" font-size="10.5" fill="#475569">转回原朝向，后退时显示笑脸，冷却 2 s 再找下一个目标</text>
  <text x="380" y="684" text-anchor="middle" font-size="10.5" fill="#475569">丢掉动作期间积压的旧帧</text>

</svg>
