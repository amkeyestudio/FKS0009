<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="800" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Wi-Fi 点阵弹幕</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M380,96 L380,114"/>
    <path d="M380,174 L380,188"/>
    <path d="M380,248 L380,296"/>
    <path d="M380,346 L380,358"/>
    <path d="M240,410 L180,410 L180,513"/>
    <path d="M520,410 L600,410 L600,513"/>
    <path d="M180,565 L180,638"/>
    <path d="M600,565 L600,638"/>
  </g>

  <rect x="310" y="62" width="140" height="34" rx="17" fill="#1e293b"/>
  <text x="380" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">开始</text>

  <rect x="160" y="114" width="440" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">连接 Wi-Fi</text>
  <text x="380" y="158" text-anchor="middle" font-size="12" fill="#0369a1">连上后打印板子 IP，手机浏览器输这个地址</text>

  <rect x="160" y="188" width="440" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">启动网页服务</text>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#0369a1">首页给手机看，提交入口收文字</text>

  <rect x="260" y="296" width="240" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="326" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">处理一轮网页请求</text>

  <polygon points="380,358 520,410 380,462 240,410" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">整句宽度 ≤ 16 列？</text>
  <text x="380" y="425" text-anchor="middle" font-size="11.5" fill="#b45309">即最多两个字符</text>

  <polygon points="180,513 290,540 180,567 70,540" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="180" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">文字换过吗？</text>

  <polygon points="600,513 665,540 600,567 535,540" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="600" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">到 120 ms 了？</text>

  <rect x="60" y="638" width="240" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="662" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">居中静止显示</text>
  <text x="180" y="683" text-anchor="middle" font-size="12" fill="#15803d">两侧补空列，只画这一次</text>

  <rect x="480" y="638" width="240" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="662" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">滚一列并写屏</text>
  <text x="600" y="683" text-anchor="middle" font-size="12" fill="#15803d">滚完整句回第 0 列</text>

  <text x="256" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">是</text>
  <text x="506" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">否</text>
  <text x="202" y="600" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">是</text>
  <text x="307" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">否</text>
  <text x="622" y="600" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">是</text>
  <text x="516" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">否</text>

  <g stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none">
    <path d="M180,700 L180,758"/>
    <path d="M290,540 L340,540 L340,758"/>
    <path d="M600,700 L600,758"/>
    <path d="M535,540 L460,540 L460,758"/>
    <path d="M180,758 L730,758"/>
  </g>
  <g stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowdash)">
    <path d="M730,758 L730,321 L504,321"/>
  </g>
  <text x="420" y="740" text-anchor="middle" font-size="11.5" fill="#0284c7">四种走法最后都回到主循环，进入下一轮</text>
</svg>
