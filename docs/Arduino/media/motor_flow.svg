<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="700" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">电机驱动</text>

  <rect x="200" y="80" width="360" height="46" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">速度带符号，方向由符号决定</text>
  <text x="380" y="119" text-anchor="middle" font-size="11" fill="#cbd5e1">正数正转 · 负数反转 · 0 停</text>

  <path d="M380,126 L380,152" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- B 路 -->
  <rect x="260" y="154" width="240" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="380" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">右轮：先判方向，再给速度</text>

  <path d="M380,182 L380,200" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <polygon points="380,202 494,256 380,310 266,256" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="380" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">速度是正数吗？</text>
  <text x="380" y="270" text-anchor="middle" font-size="10.5" fill="#b45309">看符号定方向</text>

  <path d="M494,256 L520,256" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M520,256 L520,232 L540,232" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,256 L520,298 L540,298" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="497" y="246" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <text x="497" y="292" font-size="11" font-weight="bold" fill="#dc2626">否</text>

  <rect x="542" y="206" width="196" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">正转：方向脚拉高</text>
  <text x="640" y="245" text-anchor="middle" font-size="10.5" fill="#15803d">速度值直接写进占空比</text>

  <rect x="542" y="272" width="196" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">反转：方向脚拉低</text>
  <text x="640" y="311" text-anchor="middle" font-size="10.5" fill="#b91c1c">把速度取绝对值再写</text>

  <!-- A 路 -->
  <rect x="260" y="368" width="240" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="380" y="387" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">左轮：同样的两步</text>

  <path d="M380,396 L380,414" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <polygon points="380,416 494,470 380,524 266,470" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="380" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">速度是正数吗？</text>
  <text x="380" y="484" text-anchor="middle" font-size="10.5" fill="#b45309">左右两路完全对称</text>

  <path d="M494,470 L520,470" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path d="M520,470 L520,446 L540,446" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,470 L520,512 L540,512" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="497" y="460" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <text x="497" y="506" font-size="11" font-weight="bold" fill="#dc2626">否</text>

  <rect x="542" y="420" width="196" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="440" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">正转：方向脚拉高</text>
  <text x="640" y="459" text-anchor="middle" font-size="10.5" fill="#15803d">速度值直接写进占空比</text>

  <rect x="542" y="486" width="196" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">反转：方向脚拉低</text>
  <text x="640" y="525" text-anchor="middle" font-size="10.5" fill="#b91c1c">把速度取绝对值再写</text>

  <path d="M380,524 L380,556" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="270" y="558" width="220" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="579" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">两轮按各自速度转动</text>
  <text x="380" y="597" text-anchor="middle" font-size="10.5" fill="#64748b">前进 / 后退 / 转向都是它的组合</text>

</svg>
