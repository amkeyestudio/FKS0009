<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" width="800" height="740" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="800" height="740" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Wi-Fi 全功能车</text>

  <!-- 开始 -->
  <rect x="310" y="62" width="180" height="28" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">网页按下模式按钮</text>
  <path d="M400,90 L400,110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 复位 -->
  <rect x="150" y="112" width="500" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">切换模式：不管切没切，先把状态复位</text>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#0369a1">停车 · 状态机回第一步 · 清丢线计时</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#0369a1">云台回正 90° · 刷新超时计时</text>

  <path d="M400,174 L400,196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 判断 -->
  <polygon points="400,196 560,242 400,288 240,242" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="400" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">模式真的变了吗？</text>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#b45309">一样就不重复处理</text>

  <!-- 否定分歧：跳过刷屏 -->
  <text x="576" y="234" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <path d="M560,242 L594,242" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="598" y="214" width="182" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="689" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">跳过刷屏</text>
  <text x="689" y="256" text-anchor="middle" font-size="11" fill="#475569">点阵画面原样留着</text>

  <!-- 是：刷点阵 -->
  <text x="412" y="304" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <path d="M400,288 L400,308" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="150" y="310" width="500" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">按新模式刷点阵图标</text>
  <text x="400" y="351" text-anchor="middle" font-size="11" fill="#15803d">循迹：先关屏，再把两根引脚交给循迹传感器</text>
  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#15803d">其余：手动笑脸 · 避障感叹号 · 跟随爱心</text>

  <!-- 两条路汇合到分发 -->
  <path d="M400,386 L400,444" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M689,270 L689,468 L556,468" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 分发 -->
  <rect x="250" y="446" width="300" height="44" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="473" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">每一轮按模式分发</text>

  <!-- 分支总线 -->
  <path d="M400,490 L400,516" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M105,516 L690,516" stroke="#475569" stroke-width="2" fill="none"/>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M105,516 L105,538"/>
    <path d="M300,516 L300,538"/>
    <path d="M495,516 L495,538"/>
    <path d="M690,516 L690,538"/>
  </g>

  <!-- 四个分支 -->
  <rect x="20" y="540" width="170" height="76" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="105" y="564" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">manual</text>
  <text x="105" y="584" text-anchor="middle" font-size="11" fill="#0369a1">网页方向键直驱</text>
  <text x="105" y="602" text-anchor="middle" font-size="11" fill="#0369a1">1.5 s 没指令就停车</text>

  <rect x="215" y="540" width="170" height="76" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="300" y="564" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">line</text>
  <text x="300" y="584" text-anchor="middle" font-size="11" fill="#0369a1">五路循迹</text>
  <text x="300" y="602" text-anchor="middle" font-size="11" fill="#0369a1">5 ms 一轮，不看网页</text>

  <rect x="410" y="540" width="170" height="76" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="495" y="564" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">avoid</text>
  <text x="495" y="584" text-anchor="middle" font-size="11" fill="#0369a1">避障状态机</text>
  <text x="495" y="602" text-anchor="middle" font-size="11" fill="#0369a1">停车、转头、绕行的顺序</text>

  <rect x="605" y="540" width="170" height="76" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="690" y="564" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">follow</text>
  <text x="690" y="584" text-anchor="middle" font-size="11" fill="#0369a1">追着人走</text>
  <text x="690" y="602" text-anchor="middle" font-size="11" fill="#0369a1">100 ms 测一次</text>

  <!-- 汇合 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M105,616 L105,636"/>
    <path d="M300,616 L300,636"/>
    <path d="M495,616 L495,636"/>
    <path d="M690,616 L690,636"/>
    <path d="M105,636 L690,636"/>
  </g>
  <path d="M400,636 L400,656" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="330" y="658" width="140" height="28" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="677" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">下一轮</text>

  <!-- 循环回分发 -->
  <path d="M400,686 L400,712 L8,712 L8,468 L246,468" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowdash)"/>

</svg>
