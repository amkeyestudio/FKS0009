<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">循迹行驶</text>

  <!-- 主干 -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M170,108 L170,124"/>
    <path d="M170,172 L170,192"/>
    <path d="M170,240 L170,262"/>
  </g>

  <rect x="100" y="80" width="140" height="28" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="170" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">开始</text>

  <rect x="40" y="124" width="260" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="170" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">读五路，拼成一个状态值</text>
  <text x="170" y="162" text-anchor="middle" font-size="10.5" fill="#0369a1">五路各占一位，从最左到最右</text>

  <rect x="40" y="192" width="260" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">按这个状态值分类</text>
  <text x="170" y="230" text-anchor="middle" font-size="10.5" fill="#b45309">每类对应一种修正力度</text>

  <!-- 分支总线 -->
  <path d="M300,216 L318,216" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M318,150 L318,606" stroke="#475569" stroke-width="1.8" fill="none"/>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M318,150 L334,150"/>
    <path d="M318,264 L334,264"/>
    <path d="M318,378 L334,378"/>
    <path d="M318,492 L334,492"/>
    <path d="M318,606 L334,606"/>
  </g>

  <!-- 1 居中 -->
  <rect x="336" y="118" width="404" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="538" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">居中：00100 / 01110 / 11111</text>
  <text x="538" y="158" text-anchor="middle" font-size="10.5" fill="#15803d">两轮同速 115 / 115，直行</text>
  <text x="538" y="174" text-anchor="middle" font-size="10.5" fill="#15803d">记住「线在中间」</text>

  <!-- 2 偏左 -->
  <rect x="336" y="204" width="404" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="538" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">线偏左：01100 / 01000 / 11100 / 11000 / 10000</text>
  <text x="538" y="245" text-anchor="middle" font-size="10.5" fill="#0369a1">01100（B、C 压线）：85 / 115，右轮降速微调</text>
  <text x="538" y="263" text-anchor="middle" font-size="10.5" fill="#0369a1">01000、11100（仅 B 或直角弯）：45 / 125，大幅修正</text>
  <text x="538" y="281" text-anchor="middle" font-size="10.5" fill="#0369a1">11000、10000（A 也压线）：−95 / 125，原地左转</text>
  <text x="538" y="301" text-anchor="middle" font-size="10.5" fill="#0369a1">记住「线在左」</text>
  <text x="538" y="318" text-anchor="middle" font-size="10.5" fill="#64748b">偏差越大，修正越狠，分三档避免画龙</text>

  <!-- 3 偏右 -->
  <rect x="336" y="336" width="404" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="538" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">线偏右：00110 / 00010 / 00111 / 00011 / 00001</text>
  <text x="538" y="377" text-anchor="middle" font-size="10.5" fill="#0369a1">00110（C、D 压线）：115 / 85，左轮降速微调</text>
  <text x="538" y="395" text-anchor="middle" font-size="10.5" fill="#0369a1">00010、00111（仅 D 或直角弯）：125 / 45，大幅修正</text>
  <text x="538" y="413" text-anchor="middle" font-size="10.5" fill="#0369a1">00011、00001（E 也压线）：125 / −95，原地右转</text>
  <text x="538" y="433" text-anchor="middle" font-size="10.5" fill="#0369a1">记住「线在右」</text>
  <text x="538" y="450" text-anchor="middle" font-size="10.5" fill="#64748b">与偏左完全镜像，只是左右轮对调</text>

  <!-- 4 丢线 -->
  <rect x="336" y="468" width="404" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="538" y="489" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">全 0：五路都没看到线</text>
  <text x="538" y="509" text-anchor="middle" font-size="10.5" fill="#b91c1c">记下丢线时刻，1.5 秒内按记忆方向原地找线</text>
  <text x="538" y="527" text-anchor="middle" font-size="10.5" fill="#b91c1c">线原在左就往左找，原在右就往右找，原来直行就停</text>
  <text x="538" y="547" text-anchor="middle" font-size="10.5" fill="#b91c1c">超过 1.5 s 仍未找到 → 停车认输</text>

  <!-- 5 其他 -->
  <rect x="336" y="582" width="404" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="538" y="602" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">其余组合：不处理</text>
  <text x="538" y="620" text-anchor="middle" font-size="10.5" fill="#475569">其余组合（如 00101）是瞬时抖动，保持上一轮动作</text>

  <!-- 循环 -->
  <path d="M170,240 L170,300 L12,300 L12,164 L36,164" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowdash)"/>
</svg>
