<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">二维码任务卡</text>

  <rect x="240" y="80" width="280" height="40" rx="8" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">从串口读出卡上的内容</text>

  <path d="M380,120 L380,142" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <polygon points="380,142 500,186 380,230 260,186" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">读到内容了吗？</text>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#b45309">画面里没有卡</text>

  <!-- 空：停车解锁 -->
  <path d="M260,186 L170,186 L170,250" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="196" y="178" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <rect x="40" y="250" width="260" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">清空记录，解锁</text>
  <text x="170" y="290" text-anchor="middle" font-size="10.5" fill="#b91c1c">停车，点阵回眼睛</text>
  <text x="170" y="307" text-anchor="middle" font-size="10.5" fill="#b91c1c">卡移开后下一张才能触发</text>

  <!-- 有卡 -->
  <path d="M380,230 L380,250" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="392" y="246" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <polygon points="380,250 500,294 380,338 260,294" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">和上一张一样吗？</text>
  <text x="380" y="308" text-anchor="middle" font-size="10.5" fill="#b45309">还是同一张卡</text>

  <!-- 是：跳过 -->
  <path d="M500,294 L580,294 L580,356" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="546" y="286" font-size="11" font-weight="bold" fill="#16a34a">是</text>
  <rect x="450" y="356" width="260" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="377" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">跳过，不重复执行</text>
  <text x="580" y="396" text-anchor="middle" font-size="10.5" fill="#475569">等 20 ms 进入下一轮</text>

  <!-- 否：执行 -->
  <path d="M380,338 L380,356" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <text x="392" y="352" font-size="11" font-weight="bold" fill="#dc2626">否</text>
  <rect x="90" y="356" width="300" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="377" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">先记下这张卡，再执行动作</text>
  <text x="240" y="396" text-anchor="middle" font-size="10.5" fill="#15803d">顺序不能反，否则执行期间会重复触发</text>

  <path d="M240,412 L240,432" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <polygon points="240,432 360,476 240,520 120,476" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="240" y="472" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">是四张卡之一？</text>
  <text x="240" y="490" text-anchor="middle" font-size="10.5" fill="#b45309">按内容比较</text>

  <path d="M120,476 L50,476 L50,528" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="76" y="468" font-size="10.5" font-weight="bold" fill="#16a34a">是</text>
  <rect x="20" y="528" width="220" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="549" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">走 1000 ms 后停车</text>
  <text x="130" y="567" text-anchor="middle" font-size="10.5" fill="#15803d">LEFT / RIGHT 是画弧，不是原地转</text>

  <path d="M360,476 L430,476 L430,528" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="386" y="468" font-size="10.5" font-weight="bold" fill="#dc2626">否</text>
  <rect x="440" y="528" width="270" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="575" y="549" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">不做动作</text>
  <text x="575" y="567" text-anchor="middle" font-size="10.5" fill="#475569">只在串口提示扫到了什么内容</text>

  <path d="M130,584 L130,606 L736,606 L736,110 L524,110" stroke="#0ea5e9" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowdash)"/>
</svg>
