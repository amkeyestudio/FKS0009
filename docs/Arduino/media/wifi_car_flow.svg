<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Wi-Fi 控车</text>

  <!-- 第一段：指令分发 -->
  <rect x="60" y="80" width="640" height="30" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1.2"/>
  <text x="380" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">① 网页按钮发出指令</text>

  <path d="M380,110 L380,126" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="200" y="128" width="360" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">先刷新超时计时</text>
  <text x="380" y="166" text-anchor="middle" font-size="10.5" fill="#0369a1">再按字母往下比，命中一条就返回</text>

  <path d="M380,174 L380,192" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <polygon points="380,192 520,240 380,288 240,240" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">是哪个指令？</text>
  <text x="380" y="256" text-anchor="middle" font-size="10" fill="#b45309">前进 / 后退 / 左转 / 右转 / 其他</text>

  <!-- 左总线：两路 -->
  <path d="M240,240 L30,240 L30,399" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M30,331 L62,331" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M30,399 L62,399" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- 右总线：两路 -->
  <path d="M520,240 L730,240 L730,399" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M730,331 L698,331" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M730,399 L698,399" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="64" y="306" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="174" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">前进、后退</text>
  <text x="174" y="345" text-anchor="middle" font-size="10" fill="#15803d">两轮同速转，速度 180</text>

  <rect x="64" y="374" width="220" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="174" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">左转、右转</text>
  <text x="174" y="413" text-anchor="middle" font-size="10" fill="#15803d">原地转向，速度 180</text>

  <rect x="476" y="306" width="220" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="586" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">其他字母：也停车</text>
  <text x="586" y="345" text-anchor="middle" font-size="10" fill="#475569">没定义的字母一律按停车</text>

  <rect x="476" y="374" width="220" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="586" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">s：停车</text>
  <text x="586" y="413" text-anchor="middle" font-size="10" fill="#b91c1c">松手就发 s，落到 else 停车</text>

  <!-- 分隔 -->
  <line x1="60" y1="444" x2="700" y2="444" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 第二段：超时 -->
  <rect x="60" y="458" width="640" height="30" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="1.2"/>
  <text x="380" y="478" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">② 另有一道保险：超时检查</text>

  <path d="M380,488 L380,504" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="170" y="506" width="420" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="527" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">距上次指令超过 1500 ms ？</text>
  <text x="380" y="546" text-anchor="middle" font-size="10" fill="#b45309">是 → 停车，手机断连或走出覆盖范围时防止失控</text>

</svg>
